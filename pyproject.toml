[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "leakcheck"
version = "1.0.1"
description = "Screen reported classification results for the resampling-before-splitting artefact"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "BSD-3-Clause"}
authors = [
  {name = "Hieu Le Ngoc", email = "lnhieu@ptit.edu.vn"},
  {name = "Trung Huynh Ngoc Thanh", email = "hnttrung@ufm.edu.vn"},
]
maintainers = [
  {name = "Hieu Le Ngoc", email = "occbuu@gmail.com"},
]
keywords = ["data leakage", "class imbalance", "SMOTE", "reproducibility", "peer review"]
dependencies = ["numpy>=1.21"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/occbuu/leakcheck"
Repository = "https://github.com/occbuu/leakcheck"
Issues = "https://github.com/occbuu/leakcheck/issues"

[project.optional-dependencies]
table = ["pandas>=1.3"]
dev = ["pytest>=7", "pandas>=1.3", "scikit-learn>=1.1"]

[project.scripts]
leakcheck = "leakcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leakcheck = ["model.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
